<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="구구단 러너">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f8f3f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>구구단 러너</title>
<style>
:root{
  --bg:#e8f3ea;--fg:#14301c;--card:#ffffff;--muted:#4f6b57;--accent:#1f8f3f;--accent-fg:#ffffff;--line:rgba(20,48,28,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1b12;--fg:#e6f4e8;--card:#17291c;--muted:#9cb8a2;--accent:#4cc06a;--accent-fg:#08170c;--line:rgba(230,244,232,.18)}
}
:root[data-theme="dark"]{--bg:#0e1b12;--fg:#e6f4e8;--card:#17291c;--muted:#9cb8a2;--accent:#4cc06a;--accent-fg:#08170c;--line:rgba(230,244,232,.18)}
html{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;min-height:460px;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,30,16,.28)}
.ov[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;max-width:340px;width:100%;text-align:center}
.card{max-height:100%;overflow-y:auto}
.card h1{margin:0 0 6px;font-size:28px;font-weight:800;letter-spacing:-.02em}
.card p{margin:0 0 14px;font-size:14px;line-height:1.55;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}
.chip{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{width:100%;padding:13px 0;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);margin-top:8px;font-size:15px;font-weight:600}
.big{font-size:30px;font-weight:800;margin:4px 0 2px;letter-spacing:-.01em}
.card p,.big{overflow-wrap:anywhere}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;font-size:.66em;line-height:1.15}
.fr i{font-style:normal;padding:0 5px}
.fr i:first-child{border-bottom:2px solid currentColor}
.sub{font-size:14px;color:var(--muted);margin:0 0 12px}
.stat{display:flex;justify-content:center;gap:24px;margin:8px 0 16px;font-size:14px;color:var(--muted)}
.stat b{display:block;font-size:22px;color:var(--fg)}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:0 0 6px}
.tabs .chip{font-size:13px;padding:8px 2px;white-space:pre-line;line-height:1.3}
.chip[aria-disabled="true"]{opacity:.55;cursor:default}
.hint{font-size:12px;color:var(--muted);min-height:16px;margin:0 0 10px}
.mute{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;width:38px;height:38px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(16,37,66,.86);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.mute:focus-visible{outline:3px solid #ffd43b;outline-offset:2px}
.btn:disabled{opacity:.6;cursor:default}
.btn.small{padding:8px 0;font-size:13px;border-radius:10px;margin-top:0}
#shop{z-index:6}
#casemod{z-index:6}
.coinbar{font-size:20px;font-weight:800;margin:0 0 2px}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.item{border:1px solid var(--line);border-radius:14px;padding:10px 8px}
.item.on{border:2px solid var(--accent);padding:9px 7px}
.item .pv{width:84px;height:75px;display:block;margin:0 auto 4px}
.item .nm{font-size:14px;font-weight:700;margin-bottom:6px}
.item .nm.lock{color:var(--muted);font-weight:600}
.rev{margin:0 0 4px;text-align:left}
.rev .row{font-size:14px;font-weight:600;margin-bottom:6px}
.rev .chips{margin-bottom:12px}
.spd{margin:0 0 16px;text-align:left}
.spd .row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;margin-bottom:6px}
.spd output{font-weight:800;color:var(--accent)}
.spd input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
.spd .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="구구단 러너 게임 화면"></canvas>
  <button class="mute" id="mute" type="button" aria-label="배경음악 끄기" aria-pressed="true">🎵</button>

  <div class="ov" id="menu">
    <div class="card">
      <h1>구구단 러너</h1>
      <p>굴러가다가 나오는 두 문 중에 정답 문 쪽을 탭하세요. 오답 문으로 가면 바로 끝나요. 정답 20개를 맞히면 월드 클리어! 길에서 선물상자를 먹으면 랜덤 아이템이 나와요. 위쪽 ♪ 버튼으로 배경음악을 끌 수 있어요.<br>화면 왼쪽/오른쪽 탭, 또는 방향키 ← →</p>
      <div class="tabs" role="group" aria-label="월드 선택">
        <button type="button" class="chip" id="tab1" aria-pressed="true">월드 1
2~9단</button>
        <button type="button" class="chip" id="tab2" aria-pressed="false" aria-disabled="true">월드 2 🔒</button>
        <button type="button" class="chip" id="tab3" aria-pressed="false" aria-disabled="true">월드 3 🔒</button>
        <button type="button" class="chip" id="tab4" aria-pressed="false" aria-disabled="true">월드 4 🔒</button>
        <button type="button" class="chip" id="tab5" aria-pressed="false" aria-disabled="true">월드 5 🔒</button>
        <button type="button" class="chip" id="tab6" aria-pressed="false" aria-disabled="true">월드 6 🔒</button>
      </div>
      <div class="hint" id="hint"></div>
      <div class="chips" id="chips" role="group" aria-label="연습할 단 또는 문제 종류 선택"></div>
      <div class="rev">
        <div class="row">부활 횟수</div>
        <div class="chips" id="revs" role="group" aria-label="부활 횟수 선택"></div>
      </div>
      <div class="spd">
        <div class="row"><label for="spd">속도</label><output id="spdOut" for="spd">1.0배</output></div>
        <input id="spd" type="range" min="0.5" max="2" step="0.1" value="1">
        <div class="ends"><span>느리게</span><span>빠르게</span></div>
      </div>
      <button class="btn" id="start" type="button">시작하기</button>
      <button class="btn ghost shopbtn" type="button">🪙 캐릭터 상점</button>
      <button class="btn ghost casebtn" type="button">🎁 배경 케이스</button>
    </div>
  </div>

  <div class="ov" id="casemod" hidden>
    <div class="card">
      <h1>배경 케이스</h1>
      <div class="coinbar">🪙 <span id="caseCoins">0</span></div>
      <div class="hint" id="caseMsg">케이스를 열어서 랜덤 배경을 모아 보세요.</div>
      <button class="btn" id="caseOpen" type="button">🎁 케이스 열기 (40코인)</button>
      <button class="btn ghost" id="caseBuyAll" type="button">🪙 남은 배경 전체 구매</button>
      <div class="shop-grid" id="caseGrid"></div>
      <button class="btn ghost" id="caseClose" type="button">닫기</button>
    </div>
  </div>

  <div class="ov" id="shop" hidden>
    <div class="card">
      <h1>캐릭터 상점</h1>
      <div class="coinbar">🪙 <span id="shopCoins">0</span></div>
      <div class="hint" id="shopMsg">코인을 모아 캐릭터를 사고 장착해 보세요.</div>
      <div class="shop-grid" id="shopGrid"></div>
      <button class="btn" id="shopClose" type="button">닫기</button>
    </div>
  </div>

  <div class="ov" id="clear" hidden>
    <div class="card">
      <div class="sub">클리어</div>
      <div class="big" id="clTitle"></div>
      <p id="clMsg"></p>
      <div class="stat"><div>최고 점수<b id="clScore">0</b></div><div>코인<b id="clCoin">0</b></div></div>
      <button class="btn" id="clNext" type="button">월드 2 시작</button>
      <button class="btn ghost" id="clAgain" type="button">다시 하기</button>
      <button class="btn ghost" id="clMenu" type="button">단·속도 바꾸기</button>
      <button class="btn ghost shopbtn" type="button">🪙 캐릭터 상점</button>
      <button class="btn ghost casebtn" type="button">🎁 배경 케이스</button>
    </div>
  </div>

  <div class="ov" id="over" hidden>
    <div class="card">
      <div class="sub">게임 오버</div>
      <div class="big" id="ovQ"></div>
      <p id="ovPick"></p>
      <div class="stat"><div>이번 점수<b id="ovScore">0</b></div><div>최고 점수<b id="ovBest">0</b></div><div>코인<b id="ovCoin">0</b></div></div>
      <button class="btn" id="revive" type="button" hidden>부활하기</button>
      <button class="btn" id="reviveCoin" type="button" hidden>🪙 코인으로 부활</button>
      <button class="btn" id="again" type="button">다시 하기</button>
      <button class="btn ghost" id="toMenu" type="button">단·속도 바꾸기</button>
      <button class="btn ghost shopbtn" type="button">🪙 캐릭터 상점</button>
      <button class="btn ghost casebtn" type="button">🎁 배경 케이스</button>
    </div>
  </div>
</div>

<script>
(function(){
var FONT='"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=0,H=0;
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);

  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);

function dk(d){return world===3?100+d:(world===4?200+d:(world===5?300+d:(world===6?400+d:d)));}
function fmtNum(n){var t=String(n);return (world===5||world===6)?t.replace(/\B(?=(\d{3})+(?!\d))/g,','):t;}
var WORLDS={
  1:{name:'월드 1',min:2,max:9,goal:20,theme:{sky0:'#4fb6ff',sky1:'#d9f1ff',sun:'#ffe066',ground:'#3f9b3b',sideA:'#47a542',sideB:'#3b9538',trackA:'#7fdc5a',trackB:'#72cf4e',fog0:'rgba(217,241,255,.95)',fog1:'rgba(217,241,255,0)'}},
  2:{name:'월드 2',min:10,max:19,goal:20,theme:{sky0:'#5b3fd6',sky1:'#ffb48a',sun:'#ffd166',ground:'#2b7a6a',sideA:'#33897a',sideB:'#2a7365',trackA:'#5fd3b0',trackB:'#52c5a3',fog0:'rgba(255,180,138,.95)',fog1:'rgba(255,180,138,0)'}},

  6:{name:'월드 6',min:1,max:2,goal:10,theme:{sky0:'#05010f',sky1:'#7b2cbf',sun:'#00f5d4',ground:'#10002b',sideA:'#240046',sideB:'#1c0038',trackA:'#5a189a',trackB:'#4b1284',fog0:'rgba(123,44,191,.95)',fog1:'rgba(123,44,191,0)'}}
};
var world=1,w2open=false,w3open=false,w4open=false,w5open=false,w6open=false,winT=0;
var reviveMax=1,revives=1;
try{var rv=parseInt(localStorage.getItem('gugu_runner_rev'),10);if(rv>=0&&rv<=3){reviveMax=rv;}}catch(e){}
var score=0,best=0;
function bestKey(w){return w===1?'gugu_runner_best':'gugu_runner_best_w'+w;}
function loadBest(){best=0;try{best=parseInt(localStorage.getItem(bestKey(world))||'0',10)||0;}catch(e){}}
try{w2open=localStorage.getItem('gugu_runner_w2')==='1';}catch(e){}

try{w5open=localStorage.getItem('gugu_runner_w5')==='1';}catch(e){}
try{w6open=localStorage.getItem('gugu_runner_w6')==='1';}catch(e){}
loadBest();
var gates=[],off=0,roll=0,px=1,laneTarget=1,menuT=0,dyingT=0,shake=0,clock=0;
var gifts=[],coins=[],shield=0,slowT=0,coinRevives=0;
var particles=[],pops=[],shards=[],rings=[],lastQ='',info=null;
var LEFT=-1,RIGHT=1;
var speedMul=1;
try{var sv=parseFloat(localStorage.getItem('gugu_runner_speed'));if(sv>=0.5&&sv<=2){speedMul=sv;}}catch(e){}
var COL={'-1':'#339af0','1':'#f76707'};

/* ---------- sound ---------- */
var ac=null;
function beep(f,d,ty,vol){
  try{
    ensureAc();
    var o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime,v=vol||0.07;
    o.type=ty||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.0001,n+d);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d);
  }catch(e){}
}

try{musicOn=localStorage.getItem('gugu_runner_music')!=='0';}catch(e){}
var mGain=null,mFilter=null,mTimer=null,mNext=0,mStep=0,noiseBuf=null,duckState=1,MVOL=0.55;
var MUS={

    [77,0,79,0,81,0,84,0,79,0,77,0,76,0,0,0]]},

};
function ensureAc(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended'){try{ac.resume();}catch(e){}}
  return ac;
}
function mf(m){return 440*Math.pow(2,(m-69)/12);}
function mTone(f,t,d,type,vol,dest){
  var o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+0.02);
}
function mNoise(t,d,ftype,freq,vol){
  var src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  src.buffer=noiseBuf;f.type=ftype;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  src.connect(f);f.connect(g);g.connect(mGain);src.start(t);src.stop(t+d+0.02);
}
function mKick(t){
  var o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);

function mPlay(step,t){

  var pos=step%(M.mel.length*16),bar=Math.floor(pos/16),s=pos%16;
  var sd=60/(M.bpm*(0.85+0.15*speedMul))/4;
  var n=M.mel[bar][s];
  if(n){mTone(mf(n),t,sd*1.8,M.wave,M.wave==='square'?0.032:0.06,mFilter);}
  if(s%2===0){
    var root=M.bass[bar%M.bass.length];
    mTone(mf(root+((s===4||s===12)?12:0)),t,sd*1.7,'triangle',0.11,mGain);
    mNoise(t,0.04,'highpass',7000,s%4===2?0.05:0.025);
  }
  if(s%4===0){mKick(t);}
  if(s===4||s===12){mNoise(t,0.09,'bandpass',1800,0.09);}
  return sd;
}

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pickDan(){
  var w=WORLDS[world],list=[];for(var d=w.min;d<=w.max;d++){if(dans[dk(d)]){list.push(d);}}
  return list[rnd(0,list.length-1)];
}
function gcd(a,b){while(b){var t=a%b;a=b;b=t;}return a;}
function mkFrac(n,d){var g=gcd(n,d);n=n/g;d=d/g;return d===1?n:{n:n,d:d};}
function vn(v){return typeof v==='object'?v.n:v;}
function vd(v){return typeof v==='object'?v.d:1;}
function vEq(x,y){return vn(x)*vd(y)===vn(y)*vd(x);}
function genQ4(){
  var types=[];for(var d=1;d<=2;d++){if(dans[dk(d)]){types.push(d);}}
  var t=types[rnd(0,types.length-1)];
  for(var i=0;i<400;i++){
    var d1=rnd(2,9),n1=rnd(1,d1-1),n2,d2;
    if(t===1){n2=rnd(2,6);d2=1;}else{d2=rnd(2,9);n2=rnd(1,d2-1);}
    if(gcd(n1,d1)!==1){continue;}
    if(t===2&&gcd(n2,d2)!==1){continue;}
    var an=n1*d2,ad=d1*n2,g=gcd(an,ad);an=an/g;ad=ad/g;
    if(t===1&&ad>40){continue;}
    if(t===2&&(an>12||ad>12)){continue;}
    if(an===ad){continue;}
    return {t:t,n1:n1,d1:d1,n2:n2,d2:d2,key:n1+'/'+d1+'d'+n2+'/'+d2};
  }
  return {t:1,n1:1,d1:2,n2:2,d2:1,key:'1/2d2/1'};
}
function makeGate4(fq){
  var q=fq,tries=0;
  if(!q){do{q=genQ4();tries++;}while(q.key===lastQ&&tries<20);}
  lastQ=q.key;
  var ans=mkFrac(q.n1*q.d2,q.d1*q.n2),an=vn(ans),ad=vd(ans);
  var cand=[mkFrac(ad,an),mkFrac(q.n1*q.n2,q.d1*q.d2),mkFrac(an+1,ad),mkFrac(an-1<1?an+2:an-1,ad),mkFrac(an,ad+1),mkFrac(an,ad>1?ad-1:ad+2)];
  var pool=[];
  for(var i=0;i<cand.length;i++){
    var c=cand[i],ok=vn(c)>0&&vd(c)>0&&!vEq(c,ans);
    for(var j=0;ok&&j<pool.length;j++){if(vEq(pool[j],c)){ok=false;}}
    if(ok){pool.push(c);}
  }
  var wrong=pool[rnd(0,pool.length-1)];
  var cl=Math.random()<0.5?LEFT:RIGHT;
  var nums={};nums[cl]=ans;nums[-cl]=wrong;
  return {z:9,q:q,a:0,b:0,ans:ans,wrong:wrong,cl:cl,nums:nums,done:false,reveal:false};
}
function wrong5(ans,ty){
  var w=ans,tries=0;
  while((w===ans||w<=0)&&tries<30){
    tries++;
    if(ty===1){var f=0.08+Math.random()*0.17;w=Math.round(ans*(1+(Math.random()<0.5?-f:f)));}
    else{
      var r=Math.random(),u=1;
      if(r>=0.35&&r<0.6){u=10;}else if(r>=0.6&&r<0.8){u=100;}else if(r>=0.8){u=1000;}
      w=ans+(Math.random()<0.5?-1:1)*rnd(1,9)*u;
    }
  }
  if(w===ans||w<=0){w=ans+1;}
  return w;
}
function makeGate5(fa,fb){
  var a,b,tries=0;
  if(fa){a=fa;b=fb;}
  else{do{a=rnd(1000,9999);b=rnd(1000,9999);tries++;}while((a+'x'+b)===lastQ&&tries<5);}
  lastQ=a+'x'+b;
  var ans=a*b,types=[];
  for(var d=1;d<=2;d++){if(dans[dk(d)]){types.push(d);}}
  var wrong=wrong5(ans,types[rnd(0,types.length-1)]);
  var cl=Math.random()<0.5?LEFT:RIGHT;
  var nums={};nums[cl]=ans;nums[-cl]=wrong;
  return {z:9,a:a,b:b,op:'×',ans:ans,wrong:wrong,cl:cl,nums:nums,done:false,reveal:false};
}
function wrong6(ans,ty){
  var w=ans,tries=0;
  while((w===ans||w<=0n)&&tries<30){
    tries++;
    if(ty===1){w=ans+(Math.random()<0.5?-1n:1n)*(ans*BigInt(rnd(8,25))/100n);}
    else{
      var r=Math.random(),u=1n;
      if(r>=0.45&&r<0.75){u=10n;}else if(r>=0.75){u=100n;}
      w=ans+(Math.random()<0.5?-1n:1n)*BigInt(rnd(1,9))*u;
    }
  }
  if(w===ans||w<=0n){w=ans+1n;}
  return w;
}
function rnd10(){return Math.floor(Math.random()*9000000000)+1000000000;}
function makeGate6(fa,fb){
  var a,b,tries=0;
  if(fa){a=fa;b=fb;}
  else{do{a=rnd10();b=rnd10();tries++;}while((a+'x'+b)===lastQ&&tries<5);}
  lastQ=a+'x'+b;
  var ans=BigInt(a)*BigInt(b),types=[];
  for(var d=1;d<=2;d++){if(dans[dk(d)]){types.push(d);}}
  var wrong=wrong6(ans,types[rnd(0,types.length-1)]);
  var cl=Math.random()<0.5?LEFT:RIGHT;
  var nums={};nums[cl]=ans.toString();nums[-cl]=wrong.toString();
  return {z:9,a:a,b:b,op:'×',ans:ans.toString(),wrong:wrong.toString(),cl:cl,nums:nums,done:false,reveal:false};
}
function makeGate(fa,fb){
  if(world===4){return makeGate4(fa);}
  if(world===5){return makeGate5(fa,fb);}
  if(world===6){return makeGate6(fa,fb);}
  var a,b,key,tries=0,div=(world===3),ans,cand;
  if(fa){a=fa;b=fb;}
  else{
    do{
      if(div){b=pickDan();a=b*rnd(1,9);}else{a=pickDan();b=rnd(1,9);}
      key=a+(div?'d':'x')+b;tries++;
    }while(key===lastQ&&tries<20);
  }
  key=a+(div?'d':'x')+b;lastQ=key;
  if(div){
    ans=a/b;
    cand=[ans+1,ans-1,ans+2,ans-2,ans+3,ans-3,b];
  }else{
    ans=a*b;
    cand=[a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,ans+2,ans-2,ans+10,ans-10];
  }
  var pool=[];
  for(var i=0;i<cand.length;i++){if(cand[i]>0&&cand[i]!==ans&&pool.indexOf(cand[i])===-1){pool.push(cand[i]);}}
  var wrong=pool[rnd(0,pool.length-1)];
  var cl=Math.random()<0.5?LEFT:RIGHT;
  var nums={};nums[cl]=ans;nums[-cl]=wrong;
  return {z:9,a:a,b:b,op:div?'÷':'×',ans:ans,wrong:wrong,cl:cl,nums:nums,done:false,reveal:false};
}
function curGate(){
  for(var i=0;i<gates.length;i++){if(!gates[i].done){return gates[i];}}

}

/* ---------- geometry ---------- */
function hor(){return H*0.30;}
function py(){return H*0.80;}
function tw(){return Math.min(W*0.44,H*0.5);}
function Y(z){return hor()+(py()-hor())/z;}
function S(z){return 1/z;}

function laneQuad(u1,u2,za,zb,color){
  var cx=W/2,t=tw();
  var ya=Y(za),yb=Y(zb),sa=S(za),sb=S(zb);
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(cx+u1*t*sa,ya);ctx.lineTo(cx+u2*t*sa,ya);
  ctx.lineTo(cx+u2*t*sb,yb);ctx.lineTo(cx+u1*t*sb,yb);
  ctx.closePath();ctx.fill();
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

/* ---------- update ---------- */
function update(dt){
  if(state==='dying'&&dyingT<0.3){dt*=0.35;}
  clock+=dt;
  var duck=(state==='dying'||state==='over')?0.25:1;
  if(duck!==duckState){
    duckState=duck;
    if(mGain&&ac){mGain.gain.setTargetAtTime(MVOL*duck,ac.currentTime,0.12);}
  }
  var sp=0;
  if(state==='play'){sp=speedNow();}
  else if(state==='menu'||state==='win'){sp=1.6*speedMul;}
  off+=sp*dt;
  roll+=sp*dt*3.2;
  px+=(laneTarget-px)*Math.min(1,dt*14);
  if(state==='menu'){
    menuT+=dt;
    if(menuT>1.7){menuT=0;laneTarget=laneTarget===LEFT?RIGHT:LEFT;}
  }
  if(state==='play'||state==='win'){
    for(var i=0;i<gates.length;i++){gates[i].z-=sp*dt;}
    for(var j=0;j<gates.length;j++){
      var g=gates[j];
      if(state==='play'&&!g.done&&g.z<=1.0){resolve(g);if(state!=='play'){break;}}
    }
    for(var gi=0;gi<gifts.length;gi++){gifts[gi].z-=sp*dt;}
    if(state==='play'){
      for(var gk=0;gk<gifts.length;gk++){
        var gf=gifts[gk];
        if(!gf.done&&gf.z<=1.0){gf.done=true;if(laneTarget===gf.lane){collectGift(gf);}}
      }
      if(slowT>0){slowT-=dt;}
    }
    for(var ci=0;ci<coins.length;ci++){coins[ci].z-=sp*dt;}
    if(state==='play'){
      for(var cj=0;cj<coins.length;cj++){
        var cn=coins[cj];
        if(!cn.done&&cn.z<=1.0){
          cn.done=true;
          if(laneTarget===cn.lane){
            addCoins(1);cn.z=0;
            beep(1250,0.05,'square',0.04);
            burst(W/2+px*tw()*0.5,py()-tw()*0.16,['#ffd43b','#fff3bf'],4,150);
          }
        }
      }
    }
    coins=coins.filter(function(x){return x.z>0.5;});
    gifts=gifts.filter(function(x){return x.z>0.5;});
    gates=gates.filter(function(g){return g.z>0.5;});
  }
  if(state==='dying'){
    dyingT+=dt;
    if(dyingT>1.4){state='over';showOver();}
  }
  if(state==='win'){
    winT+=dt;
    if(Math.random()<dt*12){burst(W*(0.15+Math.random()*0.7),H*0.25,['#ffd43b','#69db7c','#4dabf7','#ff8787','#da77f2'],8,260);}
    if(winT>1.7){state='cleared';showClear();}
  }
  for(var q2=shards.length-1;q2>=0;q2--){
    var sh=shards[q2];
    sh.vy+=1500*dt;sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.rot+=sh.vr*dt;
    var gy=py()-sh.r;
    if(sh.y>gy){sh.y=gy;sh.vy*=-0.45;sh.vx*=0.7;sh.vr*=0.7;if(Math.abs(sh.vy)<60){sh.vy=0;}}
    sh.life-=dt*0.5;
    if(sh.life<=0){shards.splice(q2,1);}
  }
  for(var r2=rings.length-1;r2>=0;r2--){
    rings[r2].t+=dt;
    if(rings[r2].t>0.45){rings.splice(r2,1);}
  }
  shake=Math.max(0,shake-dt*2.2);
  for(var k=particles.length-1;k>=0;k--){
    var p=particles[k];
    p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.4;
    if(p.life<=0){particles.splice(k,1);}
  }
  for(var m=pops.length-1;m>=0;m--){
    pops[m].t+=dt;pops[m].y-=dt*50;
    if(pops[m].t>0.8){pops.splice(m,1);}
  }
}

/* ---------- draw ---------- */
function drawSky(){
  var h=hor(),g=ctx.createLinearGradient(0,0,0,h);
  var T=curTheme();g.addColorStop(0,T.sky0);g.addColorStop(1,T.sky1);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,h+1);
  ctx.fillStyle=T.sun;ctx.beginPath();ctx.arc(W*0.8,h*0.42,h*0.15,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';
  for(var i=0;i<3;i++){
    var cx=((clock*8+i*W*0.45)%(W+160))-80,cy=h*(0.25+i*0.2);
    ctx.beginPath();ctx.ellipse(cx,cy,42,13,0,0,Math.PI*2);ctx.ellipse(cx+22,cy-8,28,12,0,0,Math.PI*2);ctx.fill();
  }
}
function drawGround(){
  var h=hor(),cx=W/2,L=0.7,ZN=0.25,T=curTheme();
  ctx.fillStyle=T.ground;ctx.fillRect(0,h,W,H-h);
  var j0=Math.floor((off+ZN)/L)-1;
  for(var j=j0;j<j0+45;j++){
    var za=j*L-off,zb=za+L;
    if(zb<ZN){continue;}
    if(za<ZN){za=ZN;}
    if(za>30){break;}
    var even=(((j%2)+2)%2)===0;
    var ya=Y(za),yb=Y(zb);
    ctx.fillStyle=even?T.sideA:T.sideB;
    ctx.fillRect(0,ya,W,yb-ya+1);
    laneQuad(-1,1,za,zb,even?T.trackA:T.trackB);
    if(even){laneQuad(-0.012,0.012,za,zb,'rgba(255,255,255,.85)');}
  }
  laneQuad(-1,0,ZN,30,'rgba(51,154,240,.16)');
  laneQuad(0,1,ZN,30,'rgba(247,103,7,.16)');
  laneQuad(-1.03,-0.98,ZN,30,'#ffffff');
  laneQuad(0.98,1.03,ZN,30,'#ffffff');
  var fog=ctx.createLinearGradient(0,h,0,h+H*0.09);
  fog.addColorStop(0,T.fog0);fog.addColorStop(1,T.fog1);
  ctx.fillStyle=fog;ctx.fillRect(0,h,W,H*0.09);
}
function drawGate(g){
  var cx=W/2,t=tw(),s=S(g.z),y0=Y(g.z);
  var alpha=g.z<0.9?Math.max(0,(g.z-0.5)/0.4):1;
  ctx.globalAlpha=alpha;
  [LEFT,RIGHT].forEach(function(lane){
    var lx=cx+lane*t*0.5*s,bw=t*0.88*s,bh=t*0.72*s,gap=t*0.34*s;
    var bx=lx-bw/2,by=y0-gap-bh,pw=Math.max(2,bw*0.05);
    ctx.fillStyle='#f1f3f5';
    ctx.fillRect(bx+bw*0.08,by+bh,pw,gap);
    ctx.fillRect(bx+bw*0.92-pw,by+bh,pw,gap);
    var col=COL[lane];
    if(g.reveal){col=(lane===g.cl)?'#2f9e44':'#e03131';}else if(g.hint&&lane===g.cl){col='#37b24d';}
    rr(bx,by,bw,bh,bw*0.1);
    ctx.fillStyle=col;ctx.fill();
    ctx.lineWidth=Math.max(1.5,bw*0.035);ctx.strokeStyle='#ffffff';ctx.stroke();
    var nv=g.nums[lane];
    if(typeof nv==='object'){
      var fl=Math.max(String(nv.n).length,String(nv.d).length);
      var ffs=bh*(fl>=3?0.26:(fl===2?0.3:0.34));
      if(ffs>6){ctx.fillStyle='#ffffff';drawFracAt(ctx,nv.n,nv.d,lx,by+bh*0.5,ffs);}
    }else{
      var txt=fmtNum(nv),nl=txt.length,fs=bh*(nl>=3?0.46:0.55);
      ctx.fillStyle='#ffffff';ctx.font='800 '+fs+'px '+FONT;
      var mw=ctx.measureText(txt).width,mx=bw*0.88;
      if(mw>mx){fs=fs*mx/mw;ctx.font='800 '+fs+'px '+FONT;}
      if(fs>7){
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(txt,lx,by+bh*0.52);
      }
    }
  });
  ctx.globalAlpha=1;
}
function drawCoin(cn){
  var cx=W/2,t=tw(),s=S(cn.z),y0=Y(cn.z);
  var alpha=cn.z<0.9?Math.max(0,(cn.z-0.5)/0.4):1;
  var lx=cx+cn.lane*t*0.5*s,r=t*0.085*s,sx=Math.max(0.2,Math.abs(Math.cos(clock*5+cn.ph)));
  var cy=y0-r*2.2-Math.sin(clock*4+cn.ph)*r*0.25;
  ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.beginPath();ctx.ellipse(lx,y0,r*0.9,r*0.25,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd43b';ctx.strokeStyle='#f08c00';ctx.lineWidth=Math.max(1,r*0.18);
  ctx.beginPath();ctx.ellipse(lx,cy,r*sx,r,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(240,140,0,.7)';ctx.lineWidth=Math.max(1,r*0.1);
  ctx.beginPath();ctx.ellipse(lx,cy,r*sx*0.55,r*0.55,0,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=1;
}
function drawGift(gf){
  var cx=W/2,t=tw(),s=S(gf.z),y0=Y(gf.z);
  var alpha=gf.z<0.9?Math.max(0,(gf.z-0.5)/0.4):1;
  var lx=cx+gf.lane*t*0.5*s,w=t*0.34*s,bob=Math.sin(clock*4+gf.ph)*w*0.1;
  ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.beginPath();ctx.ellipse(lx,y0,w*0.55,w*0.14,0,0,Math.PI*2);ctx.fill();
  var bh=w*0.72,bx=lx-w/2,by=y0-bh-w*0.25-bob;
  ctx.fillStyle='#f06595';rr(bx,by+bh*0.28,w,bh*0.72,w*0.08);ctx.fill();
  ctx.fillStyle='#e64980';rr(bx-w*0.05,by,w*1.1,bh*0.3,w*0.06);ctx.fill();
  ctx.fillStyle='#ffd43b';
  ctx.fillRect(lx-w*0.07,by,w*0.14,bh);
  ctx.beginPath();
  ctx.ellipse(lx-w*0.14,by-w*0.05,w*0.14,w*0.09,-0.5,0,Math.PI*2);
  ctx.ellipse(lx+w*0.14,by-w*0.05,w*0.14,w*0.09,0.5,0,Math.PI*2);
  ctx.fill();
  var tk=(Math.sin(clock*6+gf.ph)+1)/2;
  ctx.globalAlpha=alpha*tk;ctx.fillStyle='#ffffff';
  var sx=lx+w*0.62,sy=by+w*0.05,sr=w*0.18;
  ctx.beginPath();ctx.moveTo(sx,sy-sr);ctx.lineTo(sx+sr*0.3,sy-sr*0.3);ctx.lineTo(sx+sr,sy);ctx.lineTo(sx+sr*0.3,sy+sr*0.3);
  ctx.lineTo(sx,sy+sr);ctx.lineTo(sx-sr*0.3,sy+sr*0.3);ctx.lineTo(sx-sr,sy);ctx.lineTo(sx-sr*0.3,sy-sr*0.3);ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;
}
function drawBall(){
  if(state==='dying'||state==='over'){return;}
  var t=tw(),R=t*0.16,x=W/2+px*t*0.5;
  var bounce=Math.abs(Math.sin(roll*1.2))*R*0.18;
  var y=py()-R-bounce;
  ctx.fillStyle='rgba(0,0,0,.22)';
  ctx.beginPath();ctx.ellipse(x,py()+2,R*0.95,R*0.25,0,0,Math.PI*2);ctx.fill();
  drawSkin(ctx,x,y,R,curSkin(),roll,(laneTarget-px)*R*0.08);
  if(shield>0){
    ctx.fillStyle='rgba(116,192,252,.25)';ctx.strokeStyle='rgba(116,192,252,.9)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(x,y,R*1.4+Math.sin(clock*6)*2,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
}
function fracSize(c,n,d,fs){c.font='800 '+fs+'px '+FONT;return Math.max(c.measureText(String(n)).width,c.measureText(String(d)).width)+fs*0.5;}
function drawFracAt(c,n,d,cx,cy,fs){
  var w=fracSize(c,n,d,fs);c.textAlign='center';c.textBaseline='middle';
  c.fillText(String(n),cx,cy-fs*0.58);c.fillText(String(d),cx,cy+fs*0.6);
  c.fillRect(cx-w/2,cy-fs*0.06,w,Math.max(2,fs*0.11));
}
function drawFq(q,cx,top){
  var fsF=22,fsT=28,gp=12,total=0,x,cy;
  var toks=[{f:[q.n1,q.d1]},{t:'÷'},q.d2===1?{t:String(q.n2)}:{f:[q.n2,q.d2]},{t:'='},{t:'?'}];
  toks.forEach(function(k){
    if(k.f){k.w=fracSize(ctx,k.f[0],k.f[1],fsF);}
    else{ctx.font='800 '+fsT+'px '+FONT;k.w=ctx.measureText(k.t).width;}
    total+=k.w;
  });
  total+=gp*(toks.length-1);
  var h=66,w=total+40;
  ctx.fillStyle='rgba(16,37,66,.86)';rr(cx-w/2,top,w,h,14);ctx.fill();
  ctx.fillStyle='#ffffff';
  x=cx-total/2;cy=top+h/2;
  toks.forEach(function(k){
    if(k.f){drawFracAt(ctx,k.f[0],k.f[1],x+k.w/2,cy,fsF);}
    else{ctx.font='800 '+fsT+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(k.t,x+k.w/2,cy+1);}
    x+=k.w+gp;
  });
}
function drawHud(){
  var cx=W/2,g=curGate(),pad=14;
  var qh=(g&&g.q)?66:48;
  var q=g?(g.q?'':(g.a+' '+(g.op||'×')+' '+g.b+' = ?')):(state==='menu'?'구구단 러너':((state==='win'||state==='cleared')?'월드 클리어!':''));
  if(q){
    ctx.font='800 28px '+FONT;
    var w=ctx.measureText(q).width+40,h=48,two=false,l1='',l2='';
    if(w>W-16&&g&&g.op){
      two=true;h=80;qh=80;
      l1=String(g.a);l2=g.op+' '+g.b+' = ?';
      w=Math.max(ctx.measureText(l1).width,ctx.measureText(l2).width)+40;
    }
    ctx.fillStyle='rgba(16,37,66,.86)';
    rr(cx-w/2,pad+42,w,h,14);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.textBaseline='middle';
    if(two){ctx.fillText(l1,cx,pad+42+h*0.3);ctx.fillText(l2,cx,pad+42+h*0.72);}
    else{ctx.fillText(q,cx,pad+42+h/2+1);}
  }
  if(g&&g.q){drawFq(g.q,cx,pad+42);}
  if(state!=='menu'){
    ctx.font='700 15px '+FONT;ctx.textBaseline='middle';
    ctx.fillStyle='rgba(16,37,66,.86)';
    rr(pad,pad,140,34,10);ctx.fill();
    rr(W-pad-84,pad,84,34,10);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.textAlign='center';
    ctx.fillText('월드'+world+'  '+score+'/'+WORLDS[world].goal+((reviveMax>0||revives>0)?'  ♥'+revives:''),pad+70,pad+18);
    ctx.fillText('최고 '+best,W-pad-42,pad+18);
  }
  if(state==='play'){
    var chips=[],cg2=curGate();
    if(shield>0){chips.push('🛡 방패');}
    if(slowT>0){chips.push('🐢 '+Math.ceil(slowT)+'초');}
    if(cg2&&cg2.hint){chips.push('💡 힌트');}
    if(chips.length){
      ctx.font='700 13px '+FONT;
      var ws=[],tot=0;
      for(var ci=0;ci<chips.length;ci++){ws.push(ctx.measureText(chips[ci]).width+18);tot+=ws[ci]+6;}
      var cxp=cx-(tot-6)/2;
      for(var cj=0;cj<chips.length;cj++){
        ctx.fillStyle='rgba(16,37,66,.86)';rr(cxp,pad+42+qh+8,ws[cj],26,13);ctx.fill();
        ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(chips[cj],cxp+ws[cj]/2,pad+42+qh+8+14);
        cxp+=ws[cj]+6;
      }
    }
  }
  if(state!=='menu'){
    var ct='🪙 '+coinsTotal+(runCoins>0?'  +'+runCoins:'');
    ctx.font='700 14px '+FONT;
    var cw=ctx.measureText(ct).width+20;
    ctx.fillStyle='rgba(16,37,66,.86)';rr(pad,H-pad-32,cw,32,10);ctx.fill();
    ctx.fillStyle='#ffe066';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ct,pad+cw/2,H-pad-16);
  }
  if(state==='play'&&score===0){
    ctx.globalAlpha=0.55+0.25*Math.sin(clock*5);
    ctx.fillStyle='#ffffff';ctx.font='800 34px '+FONT;ctx.textBaseline='middle';
    ctx.textAlign='center';
    ctx.fillText('◀',W*0.14,H*0.56);ctx.fillText('▶',W*0.86,H*0.56);
    ctx.font='700 14px '+FONT;
    ctx.fillText('왼쪽 탭',W*0.14,H*0.56+30);ctx.fillText('오른쪽 탭',W*0.86,H*0.56+30);
    ctx.globalAlpha=1;
  }
}
function drawFx(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);
  }
  ctx.globalAlpha=1;
  for(var s2=0;s2<shards.length;s2++){
    var sd=shards[s2];
    ctx.save();
    ctx.globalAlpha=Math.min(1,sd.life);
    ctx.translate(sd.x,sd.y);ctx.rotate(sd.rot);
    if(sd.k==='p'){
      ctx.beginPath();ctx.moveTo(sd.pts[0][0],sd.pts[0][1]);
      for(var pi=1;pi<sd.pts.length;pi++){ctx.lineTo(sd.pts[pi][0],sd.pts[pi][1]);}
      ctx.closePath();ctx.fillStyle=sd.c;ctx.fill();
      ctx.lineWidth=1.5;ctx.strokeStyle='#e67700';ctx.stroke();
    }else{
      ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(0,0,sd.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#212529';ctx.beginPath();ctx.arc(0,0,sd.r*0.5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
  for(var g2=0;g2<rings.length;g2++){
    var rg=rings[g2],pr=rg.t/0.45;
    ctx.globalAlpha=1-pr;ctx.lineWidth=5*(1-pr)+1;ctx.strokeStyle='#ffffff';
    ctx.beginPath();ctx.arc(rg.x,rg.y,tw()*0.16*(1+pr*5),0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(var m=0;m<pops.length;m++){
    var q=pops[m];
    ctx.globalAlpha=Math.max(0,1-q.t/0.8);
    ctx.font='800 '+(q.sz||24)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=5;ctx.strokeStyle='rgba(16,37,66,.8)';ctx.strokeText(q.txt,q.x,q.y);
    ctx.fillStyle=q.c||'#ffe066';ctx.fillText(q.txt,q.x,q.y);
  }
  ctx.globalAlpha=1;
  if(state==='dying'){
    ctx.fillStyle='rgba(224,49,49,'+Math.max(0,0.35-dyingT*0.35)+')';
    ctx.fillRect(0,0,W,H);
  }
}
function draw(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  if(shake>0){ctx.translate((Math.random()-0.5)*shake*14,(Math.random()-0.5)*shake*14);}
  drawSky();
  drawGround();
  var list=gates.concat(gifts,coins).sort(function(a,b){return b.z-a.z;});
  for(var i=0;i<list.length;i++){if(list[i].kind){drawGift(list[i]);}else if(list[i].cn){drawCoin(list[i]);}else{drawGate(list[i]);}}
  drawBall();
  drawFx();
  ctx.restore();
  drawHud();
}

/* ---------- loop ---------- */
var last=0;
function frame(ts){
  var dt=last?Math.min(0.05,(ts-last)/1000):0.016;
  last=ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
